apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-hello-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-hello
  template:
    metadata:
      labels:
        app: python-hello
    spec:
      containers:
        - name: python-app
          # This must match the tag pushed in Step 3
          image: ommpani/hello-python:latest
          imagePullPolicy: Always
